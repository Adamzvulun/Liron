<!-- The README banner (docs/assets/readme/banner.webp). To make it again: screenshot the square at 1600x900, deviceScaleFactor 2, with signedIn() from tests/e2e/fake-supabase.ts and ".lobby__top{visibility:hidden}" added, save it as scene.png next to this file, copy @fontsource/cinzel/files/cinzel-latin-900-normal.woff2 here as cinzel.woff2, screenshot this page at 1600x840 and save it as WebP (quality 82). Delete scene.png and cinzel.woff2 afterwards. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cinzel;src:url(cinzel.woff2) format('woff2');font-weight:900}
:root{--ink:#24160e}
html,body{margin:0}
.b{position:relative;width:1600px;height:840px;overflow:hidden;background:url(scene.png) center top/1600px auto no-repeat}
.b::before{content:"";position:absolute;inset:0;background:linear-gradient(rgb(20 10 4/.18),rgb(20 10 4/0) 25%)}
.sign{position:absolute;left:1030px;top:26px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:14px}
.plaque{padding:4px 40px 10px;border:6px solid var(--ink);border-radius:22px;
 background:linear-gradient(#9a6438,#5a341a 55%,#3e200c);
 box-shadow:inset 0 0 0 4px #c78a3e,inset 0 8px 0 rgb(255 220 160/.35),0 8px 0 var(--ink),0 20px 34px rgb(30 12 4/.55);
 font:900 66px/1.15 Cinzel,serif;letter-spacing:.14em;color:#ffe3a3;text-shadow:0 5px 0 var(--ink);padding-left:50px}
.morse{display:flex;gap:12px;padding:9px 18px;border:4px solid var(--ink);border-radius:999px;background:rgb(36 22 14/.82);box-shadow:0 6px 16px rgb(30 12 4/.4)}
.l{display:flex;gap:6px;align-items:center}
.d,.h{height:10px;border-radius:5px;background:#ffd36b;box-shadow:0 0 10px rgb(255 211 107/.6)}
.d{width:10px}.h{width:28px}
</style></head><body><div class="b"><div class="sign"><div class="plaque">Waymark</div>
<div class="morse" id="m"></div></div></div>
<script>
const code={W:'.--',A:'.-',Y:'-.--',M:'--',R:'.-.',K:'-.-'};
document.getElementById('m').innerHTML=[...'WAYMARK'].map(c=>'<span class="l">'+[...code[c]].map(s=>'<i class="'+(s=='.'?'d':'h')+'"></i>').join('')+'</span>').join('');
</script></body></html>
