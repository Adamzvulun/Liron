# Applies new database migrations (supabase/migrations/) automatically (ADR 0018), then uploads
# the copyrighted content behind login (ADR 0023):
#   push to dev  -> waymark-dev  (secrets SUPABASE_DEV_DB_URL, SUPABASE_DEV_SECRET_KEY)
#   push to main -> waymark-prod (secrets SUPABASE_PROD_DB_URL, SUPABASE_PROD_SECRET_KEY)
# `supabase db push` applies only migrations not yet in the project's history table
# (supabase_migrations.schema_migrations), so re-running it is safe.
# Secrets are only available to pushes on this repo, never to pull requests.
name: DB migrate

on:
  push:
    branches: [dev, main]
    paths:
      - 'supabase/migrations/**'
      - 'sources/**'
      - 'scripts/content/**'
      - 'src/core/content/**'
      # A change to how migrations run should run them (the release of v1.0.0 needed a retry).
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: db-migrate-${{ github.ref_name }}
  cancel-in-progress: false # never stop a migration halfway

permissions:
  contents: read

jobs:
  migrate:
    if: github.ref_name == 'dev' || github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The database URL is set only on the steps that use it, never while a third-party action
    # runs, as in the content job (review, 2026-11-19).
    env:
      TARGET: ${{ github.ref_name == 'main' && 'waymark-prod' || 'waymark-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.121.0
      - name: Check the secret is set
        env:
          DB_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_DEV_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "::error::No database URL secret for $TARGET. See docs/process/SUPABASE.md#migrations."
            exit 1
          fi
      - name: Show pending migrations for ${{ env.TARGET }}
        env:
          DB_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_DEV_DB_URL }}
        run: supabase db push --db-url "$DB_URL" --dry-run
      - name: Apply them to ${{ env.TARGET }}
        env:
          DB_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_DEV_DB_URL }}
        run: supabase db push --db-url "$DB_URL" --yes

  content:
    needs: migrate # the content tables must exist first
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The secrets are set only on the steps that use them, never while `npm ci` runs, so no
    # package's install script can read them (security review M2, 2026-11-04).
    env:
      TARGET: ${{ github.ref_name == 'main' && 'waymark-prod' || 'waymark-dev' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check the secret key is set
        env:
          SUPABASE_SECRET_KEY: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_SECRET_KEY || secrets.SUPABASE_DEV_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::No secret key for $TARGET. See docs/process/SUPABASE.md#private-content."
            exit 1
          fi
      # The project URL isn't secret; it comes from the project ref in the pooler user name
      # (postgres.<ref>), so there's no extra setting to keep in sync.
      - name: Find the project URL
        env:
          DB_URL: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_DB_URL || secrets.SUPABASE_DEV_DB_URL }}
        run: |
          REF=$(printf '%s' "$DB_URL" | sed -nE 's#^postgres(ql)?://postgres\.([a-z0-9]+):.*#\2#p')
          if [ -z "$REF" ]; then
            echo "::error::Couldn't read the project ref from the $TARGET database URL."
            exit 1
          fi
          echo "SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
      - name: Upload private content to ${{ env.TARGET }}
        env:
          SUPABASE_SECRET_KEY: ${{ github.ref_name == 'main' && secrets.SUPABASE_PROD_SECRET_KEY || secrets.SUPABASE_DEV_SECRET_KEY }}
        run: node scripts/content/upload-private.ts
