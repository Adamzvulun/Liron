# CI for Waymark (issue #14): lint, typecheck, unit tests, build, Playwright.
# Runs on every PR. Pushes don't run it: every PR already ran the full check on the same code
# before it merged (dev since 2026-11-10; main since 2026-11-18, when a release PR and the push
# of its merge each ran the same 20 minutes). Actions minutes cost money.
# A PR that changes only docs/ or Markdown files skips the build and Playwright.
# Private repo on GitHub Free: $12 of compute a month is included (2,000 minutes on x64 Linux at
# $0.006, 2,400 on arm64 Linux at $0.005). Without a payment method, runs stop when it's used up.
# Kept cheap (2026-11-18): one job on the cheaper arm64 runner, the browser tests on two workers
# (the runner has 2 CPUs), and superseded runs on the same branch are cancelled.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Same 2 CPUs and 8 GB as ubuntu-latest for a private repo, at $0.005 a minute instead of
    # $0.006. Playwright ships Chromium for arm64 Ubuntu 24.04.
    runs-on: ubuntu-24.04-arm
    # On one worker the browser tests took 18-20 minutes of a 20-23 minute job (424 tests,
    # 2026-11-18). On two workers they took about 40% less on 2 CPUs locally.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Docs only: every changed file is under docs/ or ends in .md.
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^docs/|\.md$'; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full check: $full"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Fine on GitHub's runners. In the Claude cloud session Chromium is pre-installed instead.
      # The runner image already has Chromium's libraries; --with-deps only adds fonts from
      # Ubuntu's mirrors (about 15 s). When those mirrors can't be reached (2026-11-11, twice:
      # apt retried for 7 minutes, then failed before any test ran), give up after 2 minutes and
      # install the browser alone.
      - if: steps.scope.outputs.full == 'true'
        run: timeout -k 10 120 npx playwright install --with-deps chromium || npx playwright install chromium
      # Playwright builds the app first (with the fake Supabase address), so the build is checked
      # here. `npm run e2e` runs them on two workers, then the @timing tests alone: they measure speed, and tests running
      # beside them would slow the page they time.
      - if: steps.scope.outputs.full == 'true'
        run: npm run e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
