# CI for Waymark (issue #14): lint, typecheck, unit tests, build, Playwright smoke.
# Runs on every PR and on pushes to main (branch flow: ADR 0015). Pushes to dev don't run it:
# every PR already ran the full check before it merged, and Actions minutes cost money (2026-11-10).
# A PR that changes only docs/ or Markdown files skips the build and Playwright (about 8 of 9 minutes).
# Private repo on GitHub Free: about 2,000 Linux minutes/month are included ($12 of compute).
# Without a payment method, runs are blocked (not billed) once that's used up.
# Kept cheap: one job, Chromium only, superseded runs on the same branch are cancelled.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Docs only: every changed file is under docs/ or ends in .md.
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=true
          if [ -n "$BASE" ]; then
            changed=$(git diff --name-only "$BASE" HEAD)
            if [ -n "$changed" ] && ! echo "$changed" | grep -qvE '^docs/|\.md$'; then full=false; fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full check: $full"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - if: steps.scope.outputs.full == 'true'
        run: npm run build
      # Fine on GitHub's runners. In the Claude cloud session Chromium is pre-installed instead.
      - if: steps.scope.outputs.full == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.scope.outputs.full == 'true'
        run: npm run e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
